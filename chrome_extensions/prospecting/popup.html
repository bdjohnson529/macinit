<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LinkedIn Connection Drafter</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #ffffff;
      --surface: #f3f4f6;
      --border: #d1d5db;
      --text-primary: #111827;
      --text-secondary: #6b7280;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-text: #ffffff;
      --success: #16a34a;
      --radius: 6px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      width: 100%;
      min-width: 300px;
      background: var(--bg);
      color: var(--text-primary);
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.5;
      padding: 16px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    header svg {
      flex-shrink: 0;
    }

    header h1 {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .field {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 5px;
    }

    input[type="text"] {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-family: var(--font);
      font-size: 14px;
      color: var(--text-primary);
      background: var(--bg);
      outline: none;
      transition: border-color 0.15s;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    textarea {
      width: 100%;
      height: 110px;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-family: var(--font);
      font-size: 14px;
      color: var(--text-primary);
      background: var(--bg);
      resize: vertical;
      outline: none;
      line-height: 1.55;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    button {
      flex: 1;
      padding: 8px 12px;
      border: none;
      border-radius: var(--radius);
      font-family: var(--font);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    button:active {
      transform: scale(0.98);
    }

    #btn-generate {
      background: var(--accent);
      color: var(--accent-text);
    }

    #btn-generate:hover {
      background: var(--accent-hover);
    }

    #btn-generate:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    #btn-copy {
      background: var(--surface);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }

    #btn-copy:hover {
      background: var(--border);
    }

    #btn-copy.copied {
      background: #dcfce7;
      border-color: #86efac;
      color: var(--success);
    }

    #status {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 8px;
      min-height: 16px;
      text-align: center;
    }

    #status.error {
      color: #dc2626;
    }
  </style>
</head>
<body>
  <header>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="24" height="24" rx="4" fill="#0A66C2"/>
      <path d="M7 10H5V19H7V10ZM6 9C6.552 9 7 8.552 7 8C7 7.448 6.552 7 6 7C5.448 7 5 7.448 5 8C5 8.552 5.448 9 6 9ZM19 14C19 11.791 17.209 10 15 10C13.791 10 12.72 10.528 12 11.354V10H10V19H12V14C12 12.895 12.895 12 14 12C15.105 12 16 12.895 16 14V19H18V14H19Z" fill="white"/>
    </svg>
    <h1>Connection Drafter</h1>
  </header>

  <div class="field">
    <label for="team-name">Team Name</label>
    <input type="text" id="team-name" value="Engineering" placeholder="e.g. Engineering, Design, Data" />
  </div>

  <div class="field">
    <label for="output">Generated Message</label>
    <textarea id="output" placeholder="Open a LinkedIn profile page, then click Generate…"></textarea>
  </div>

  <div class="btn-row">
    <button id="btn-generate">Generate</button>
    <button id="btn-copy">Copy</button>
  </div>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
